version: '3.8'
services:
  postgres-dw:
    image: postgres:15-alpine
    container_name: crypto_dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crypto_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: